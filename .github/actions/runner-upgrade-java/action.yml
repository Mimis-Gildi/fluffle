name: "Upgrade Java"
description: "Upgrades Java of java-major and java-vendor to latest via SDKMAN and sets it default."
author: "rdd13r"
branding:
  # noinspection YAMLSchemaValidation
  icon: "coffee"
  color: "orange"

inputs:
  java-major:
    description: "Java major version (e.g. 21)"
    required: true
  java-vendor:
    description: "SDKMAN Java vendor suffix (e.g. tem)"
    required: true

outputs:
  upgraded:
    description: "true if any java version was changed"
    value: ${{ steps.upgrade.outputs.upgraded }}

runs:
  using: "composite"

  steps:

    - id: upgrade
      shell: zsh -l {0}
      run: ${{ github.action_path }}/upgrade-java.sh ${{ inputs.java-major }} ${{ inputs.java-vendor }}
