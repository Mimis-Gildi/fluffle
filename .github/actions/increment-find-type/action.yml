name: "Increment Find Type"
description: "Determines version increment type (patch/minor/major/skip) from event triggers and commit-message signals."
author: "rdd13r"
branding:
  icon: "git-branch"
  color: "green"

inputs:
  force-action:
    description: "Force increment type (patch/minor/major/skip/fail). Default is patch."
    required: false
    default: "patch"
  gh-token:
    description: "Token with PR read scope (e.g., secrets.CI_PAT). Falls back to github.token when empty."
    required: false

outputs:
  type:
    description: "Increment type: patch, minor, major, skip, or fail."
    value: ${{ steps.find-increment-type.outputs.type }}

runs:
  using: "composite"

  steps:

    - id: find-increment-type
      shell: zsh -l {0}
      env:
        EVENT_NAME:       ${{ github.event_name }}
        EVENT_ACTION:     ${{ github.event.action }}
        ACTOR:            ${{ github.actor }}
        HEAD_REF:         ${{ github.head_ref }}
        REF:              ${{ github.ref }}
        REF_TYPE:         ${{ github.event.ref_type }}
        FORCE_ACTION:     ${{ inputs.force-action }}
        GH_TOKEN:         ${{ inputs.gh-token || github.token }}
      run: ${{ github.action_path }}/find-increment-type.sh
