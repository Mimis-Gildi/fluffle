name: "Increment Find Type"
description: "Determines version increment type (patch/minor/major/skip) from event triggers and commit-message signals."
author: "rdd13r"
branding:
  icon: "git-branch"
  color: "green"

inputs:
  force-major:
    description: "Force major increment regardless of signals."
    required: false
    default: "false"
  force-minor:
    description: "Force minor increment regardless of signals. force-major wins if both."
    required: false
    default: "false"
  gh-token:
    description: "Token with PR read scope (e.g., secrets.CI_PAT). Required for the PR-state probe."
    required: true

outputs:
  type:
    description: "Increment type: patch, minor, major, or skip."
    value: ${{ steps.find-increment-type.outputs.type }}

runs:
  using: "composite"

  steps:

    - id: find-increment-type
      shell: zsh -l {0}
      env:
        EVENT_NAME:   ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        ACTOR:        ${{ github.actor }}
        HEAD_REF:     ${{ github.head_ref }}
        REF:          ${{ github.ref }}
        FORCE_MAJOR:  ${{ inputs.force-major }}
        FORCE_MINOR:  ${{ inputs.force-minor }}
        GH_TOKEN:     ${{ inputs.gh-token }}
      run: ${{ github.action_path }}/find-increment-type.sh
