name: Version on New Branch
run-name: "Incremented Version on ${{ github.repository }} by ${{ github.actor }} with ${{ github.event_name }} (Attempt ${{ github.run_attempt }})"

on:
  push:
    branches-ignore:
      - release
      - 'releases/**'
      - 'renovate/**'
      - 'dependabot/**'
  create:
  pull_request:
    branches-ignore:
      - main
      - release
      - 'releases/**'
      - 'renovate/**'
      - 'dependabot/**'
    types:
      - synchronize
      - opened
      - reopened
  workflow_dispatch:
    inputs:
      force-action:
        required: false
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
          - fail
        default: patch
        description: 'Force increment type. Default is patch.'
  workflow_call:
    inputs:
      force-action:
        required: false
        type: string
        default: patch
        description: 'Force increment type (skip/patch/minor/major/fail). Default is patch.'
    secrets:
      CI_PAT_IN:
        required: false
        description: >-
          CI override token for alternative execution of this workflow;
          such as when extended for additional edits and parameter changes.
    outputs:
      type:
        value: ${{ jobs.increment.outputs.type }}
      old:
        value: ${{ jobs.increment.outputs.old }}
      new:
        value: ${{ jobs.increment.outputs.new }}
      sha:
        value: ${{ jobs.increment.outputs.sha }}

defaults:
  run:
    shell: zsh -l {0}

# Example for caller.
#concurrency:
#  group: fluffle-incrementer-${{ github.head_ref || github.ref }}
#  cancel-in-progress: true

jobs:

  increment:
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      type: ${{ steps.operation.outputs.type }}
      old: ${{ steps.version.outputs.old }}
      new: ${{ steps.version.outputs.new }}
      sha: ${{ steps.push_commits.outputs.sha }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false


      - name: Determine increment type
        id: operation
        uses: Mimis-Gildi/fluffle/.github/actions/increment-find-type@main
        with:
          force-action: ${{ inputs.force-action }}

      - name: Calculate and apply version
        id: version
        if: steps.operation.outputs.type != 'skip'
        run: |
          TYPE="${{ steps.operation.outputs.type }}"
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          if [[ "$TYPE" == "major" ]]; then
            MAX=$(git log --all --format='%H' | while read sha; do
              git show "${sha}:gradle.properties" 2>/dev/null | grep '^version=' | cut -d= -f2
            done | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [[ -n "$MAX" ]] || { echo "::error title=No Versions::No valid version found in history"; exit 1 }
            MAJOR=$(echo "$MAX" | cut -d. -f1)
            printf '::notice title=Max Version Ever::%s\n' "$MAX"
          fi

          case "$TYPE" in
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          esac

          grep -q "^version=$VERSION$" gradle.properties || { echo "::error title=Version Mismatch::Expected version=$VERSION not found"; exit 1 }
          sed -i "s/^version=$VERSION$/version=$NEW_VERSION/" gradle.properties
          printf '::notice title=%s Bump::%s -> %s\n' "${(C)TYPE}" "$VERSION" "$NEW_VERSION"

          echo "old=$VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push
        id: push_commits
        if: steps.version.outputs.new != ''
        env:
          GH_TOKEN: ${{ secrets.CI_PAT || secrets.CI_PAT_IN || github.token }}

        run: |
          git config user.name "R!dd13r"
          git config user.email "12781006+rdd13r@users.noreply.github.com"

          # This is a very specific local work-around for some agents that run on alternative git implementation.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add gradle.properties
          git fetch --all && git pull
          TYPE=${{ steps.operation.outputs.type }}
          git commit -m "${(C)TYPE} ${{ steps.version.outputs.old }} -> ${{ steps.version.outputs.new }} [skip up]"
          git push
          print "sha=$(git rev-parse HEAD)" > $GITHUB_OUTPUT

  summarize:
    needs: increment
    if: always()
    runs-on: self-hosted
    timeout-minutes: 1

    steps:

      - name: Summary
        env:
          # Computed at the expression layer: tests presence only, never exposes a secret value.
          USED_CI_SECRET: ${{ secrets.CI_PAT    != '' && 'present' || 'absent'  }}
          USED_CI_PASSED: ${{ secrets.CI_PAT_IN != '' && 'passed'  || 'absent'  }}
        run: |
          TYPE=${{ needs.increment.outputs.type }}
          OLD=${{ needs.increment.outputs.old }}
          NEW=${{ needs.increment.outputs.new }}
          BRANCH=${GITHUB_REF#refs/heads/}
          [[ -n "$NEW" ]] && ROW="| $TYPE | $OLD -> $NEW | $BRANCH |" || ROW="| $TYPE | unchanged | $BRANCH |"
          printf '## Version Increment Summary

          | Type | Version | Branch |
          |------|---------|--------|
          %s
          ' "$ROW" >> $GITHUB_STEP_SUMMARY

          printf '
          ### Token & context diagnostics
          USED_GH_TOKEN=$( [[ -n $GITHUB_TOKEN ]] && print ' set' || print ' unset' )
          USED_GITHUB_TOKEN=$( [[ -n $GH_TOKEN ]] && print ' set' || print ' unset' )

          | Field                     | Value |
          |---------------------------|-------|
          | CI Local                  | %s    |
          | CI Passed                 | %s    |
          | GH CLI in Environment     | %s    |
          | GITHUB in Environment     | %s    |
          | RUNNER_NAME               | %s    |
          | GITHUB_ACTION             | %s    |
          | GITHUB_ACTION_PATH        | %s    |
          | GITHUB_ACTION_REPO        | %s    |
          | GITHUB_ACTOR              | %s    |
          | GITHUB_JOB                | %s    |
          ' "$USED_CI_SECRET" "$USED_CI_PASSED" \
            "$USED_GH_TOKEN" "$USED_GITHUB_TOKEN" \
            "$RUNNER_NAME" "$GITHUB_ACTION" \ 
            "$GITHUB_ACTION_PATH" "$GITHUB_ACTION_REPOSITORY" \
            "$GITHUB_ACTOR" "$GITHUB_JOB" >> $GITHUB_STEP_SUMMARY
