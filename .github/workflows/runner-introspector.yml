name: War Canary
run-name: "Introspect Runner on ${{ github.repository }} by ${{ github.actor }} with ${{ github.event_name }} (Attempt ${{ github.run_attempt }})."

on:
  push:
    branches-ignore:
      - 'renovate/**'
  workflow_call:
    inputs:
      host-info:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      host-info:
        required: false
        type: boolean
        default: true
        description: "Should we probe for Hosted Infra? This is useful for debugging issues with Hosted Infra."


defaults:
  run:
    shell: zsh -l {0}

env:
  # SDKMAN
  SDKMAN_VERSION: '5.23.0'
  SDKMAN_NATIVE: '0.7.34'

  # Java
  JAVA_MAJOR: '21'
  JAVA_VENDOR: 'tem'

  # Conda
  CONDA_VERSION: '26.7.2'
  MAMBA_VERSION: '2.9.0'
  PYTHON_BASE_VERSION: '3.14.7'

  # Python and ML
  PYTHON_ENV: 'ml'
  PYTHON_PIN: '3.12'
  PYTHON_VERSION: '3.12.15'

  # Ruby
  RUBY_VERSION: '3.3.5'
  GEMS_VERSION: '3.5.16'
  BUNDLER_VERSION: '2.7.2'

jobs:

  canary-flight-job:
    runs-on: [self-hosted, peep]
    timeout-minutes: 3

    steps:

      - name: Toolchain Snapshot
        continue-on-error: true
        run: |
          print -r -- "PATH=$PATH"
          print -r -- "CONDA_SHLVL=${CONDA_SHLVL:-none} CONDA_DEFAULT_ENV=${CONDA_DEFAULT_ENV:-none}"
          whence -va sdk conda mamba python java ruby gem bundle
          sdk version
          sdk current
          java -version
          conda --version
          mamba --version
          python --version
          ruby --version
          gem --version
          bundle --version

      - name: Hosted Infra Snapshot
        if: inputs.host-info
        run: |
          echo "::group:: Hosted Infra Fingerprint"
          echo "::notice title=Event::$GITHUB_EVENT_NAME"
          echo "::notice title=Branch::$GITHUB_REF_NAME"
          echo "::notice title=Git::$(git --version)"
          echo "::notice title=GitHub CLI::$(gh version)"
          echo "::notice title=Runner::${{ runner.name }} ($( hostname -s ))"
          echo "::endgroup::"

  sdkman-job:
    needs: canary-flight-job
    runs-on: [ self-hosted, peep ]
    timeout-minutes: 6
    outputs:
      failed: ${{ steps.sdkman.outputs.failed }}
      upgraded: ${{ steps.sdkman-upgrade.outputs.upgraded }}

    steps:

      - name: Detect SDKMAN
        id: sdkman
        uses: Mimis-Gildi/fluffle/.github/actions/runner-detect-sdkman@main
        with:
          sdkman-version: ${{ env.SDKMAN_VERSION }}
          sdkman-native: ${{ env.SDKMAN_NATIVE }}

      - name: Upgrade SDKMAN
        id: sdkman-upgrade
        if: steps.sdkman.outputs.failed == 'true'
        uses: Mimis-Gildi/fluffle/.github/actions/runner-upgrade-sdkman@main


  conda-job:
    needs: canary-flight-job
    runs-on: [ self-hosted, peep ]
    timeout-minutes: 53
    outputs:
      failed: ${{ steps.conda-probe.outputs.failed }}
      inoperable: ${{ steps.conda-probe.outputs.inoperable }}
      upgraded: ${{ steps.conda-upgrade.outputs.upgraded }}
      created: ${{ steps.conda-upgrade.outputs.created }}
      installed: ${{ steps.conda-install.outputs.installed }}

    steps:

      - name: Introspect Conda
        id: conda-probe
        timeout-minutes: 7
        uses: Mimis-Gildi/fluffle/.github/actions/runner-detect-conda@main
        with:
          python-base-version: ${{ env.PYTHON_BASE_VERSION }}
          python-env: ${{ env.PYTHON_ENV }}
          python-version: ${{ env.PYTHON_VERSION }}
          conda-version: ${{ env.CONDA_VERSION }}
          mamba-version: ${{ env.MAMBA_VERSION }}

      - name: Upgrade Conda
        id: conda-upgrade
        timeout-minutes: 44
        if: steps.conda-probe.outputs.failed == 'true'
        uses: Mimis-Gildi/fluffle/.github/actions/runner-upgrade-conda@main
        with:
          python-env: ${{ env.PYTHON_ENV }}
          python-pin: ${{ env.PYTHON_PIN }}

      - name: Re-Install Conda
        id: conda-install
        timeout-minutes: 44
        if: steps.conda-probe.outputs.inoperable == 'true'
        uses: Mimis-Gildi/fluffle/.github/actions/runner-install-conda@main
        with:
          python-env: ${{ env.PYTHON_ENV }}
          python-pin: ${{ env.PYTHON_PIN }}

      - name: Verify Conda
        id: conda-verify
        timeout-minutes: 7
        if: steps.conda-probe.outputs.inoperable == 'true' || steps.conda-probe.outputs.failed == 'true'
        uses: Mimis-Gildi/fluffle/.github/actions/runner-detect-conda@main
        with:
          python-base-version: ${{ env.PYTHON_BASE_VERSION }}
          python-env: ${{ env.PYTHON_ENV }}
          python-version: ${{ env.PYTHON_VERSION }}
          conda-version: ${{ env.CONDA_VERSION }}
          mamba-version: ${{ env.MAMBA_VERSION }}

      - name: Conda Still Broken
        if: steps.conda-verify.outputs.failed == 'true' || steps.conda-verify.outputs.inoperable == 'true'
        shell: zsh {0}
        run: |
          print '::error title=Conda verify::still failed=${{ steps.conda-verify.outputs.failed }} inoperable=${{ steps.conda-verify.outputs.inoperable }} after remedy'
          exit 1


  ruby-job:
    needs: canary-flight-job
    runs-on: [ self-hosted, peep ]
    timeout-minutes: 2
    outputs:
      failed: ${{ steps.ruby.outputs.failed }}

    steps:
      - name: Introspect Ruby
        id: ruby
        uses: Mimis-Gildi/fluffle/.github/actions/runner-detect-ruby@main
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          gems-version: ${{ env.GEMS_VERSION }}
          bundler-version: ${{ env.BUNDLER_VERSION }}


  java-job:
    needs: sdkman-job
    runs-on: [ self-hosted, peep ]
    timeout-minutes: 5
    outputs:
      failed: ${{ steps.java.outputs.failed }}
      upgraded: ${{ steps.java-upgrade.outputs.upgraded }}

    steps:

      - name: Introspect Java
        id: java
        uses: Mimis-Gildi/fluffle/.github/actions/runner-detect-java@main
        with:
          java-major: ${{ env.JAVA_MAJOR }}
          java-vendor: ${{ env.JAVA_VENDOR }}

      - name: Upgrade Java
        id: java-upgrade
        if: steps.java.outputs.failed == 'true'
        uses: Mimis-Gildi/fluffle/.github/actions/runner-upgrade-java@main
        with:
          java-major: ${{ env.JAVA_MAJOR }}
          java-vendor: ${{ env.JAVA_VENDOR }}


  sdk-candidates:
    needs: sdkman-job
    runs-on: [self-hosted, peep]
    timeout-minutes: 7
    strategy:
      matrix:
        candidate: [gradle, kotlin, kobweb, maven, sbt, scala]

    steps:

      - name: Detect ${{ matrix.candidate }}
        id: detect
        uses: Mimis-Gildi/fluffle/.github/actions/runner-detect-sdk-candidate@main
        with:
          candidate: ${{ matrix.candidate }}

      - name: Upgrade ${{ matrix.candidate }}
        if: steps.detect.outputs.failed == 'true'
        uses: Mimis-Gildi/fluffle/.github/actions/runner-upgrade-sdk-candidate@main
        with:
          candidate: ${{ matrix.candidate }}


  summary:
    needs: [sdkman-job, conda-job, ruby-job, java-job, sdk-candidates]
    if: always()
    runs-on: [self-hosted, peep]
    timeout-minutes: 1

    steps:

      - name: Runner Toolchain Summary
        run: |
          {
            echo "## War Canary Summary"
            echo ""
            echo "| Component | Status | Action |"
            echo "|-----------|--------|--------|"
            echo "| SDKMAN | ${{ needs.sdkman-job.outputs.failed == 'true' && 'X' || '' }} | ${{ needs.sdkman-job.outputs.upgraded == 'true' && 'upgraded' || '' }} |"
            echo "| Conda | ${{ needs.conda-job.outputs.inoperable == 'true' && 'inoperable' || needs.conda-job.outputs.failed == 'true' && 'X' || '' }} | ${{ needs.conda-job.outputs.installed == 'true' && 'installed' || needs.conda-job.outputs.upgraded == 'true' && 'upgraded' || '' }} |"
            echo "| Ruby | ${{ needs.ruby-job.outputs.failed == 'true' && 'X' || '' }} | |"
            echo "| Java | ${{ needs.java-job.outputs.failed == 'true' && 'X' || '' }} | ${{ needs.java-job.outputs.upgraded == 'true' && 'upgraded' || '' }} |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY
